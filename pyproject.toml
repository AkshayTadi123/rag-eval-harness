[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "Evaluation harness for RAG retrieval strategies"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "ir-measures>=0.4.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "rank-bm25>=0.2.2",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
